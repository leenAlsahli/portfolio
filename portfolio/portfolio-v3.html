<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio | AI Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Readex+Pro:wght@200;300;400;500;600&display=swap">
<style>
/* Layout: soft off-white beige, neutral ink UI (buttons never clash with project images). Hero = slow beige mist + giant name that moves with scroll + pointer. */
:root{
  --bg:#faf7f1; --surface:#ffffff; --fg:#231e15; --muted:#645c4f; --line:#e7e1d4;
  --accent:#5f574b; --gold:#cfc6b4; --gold-hi:#efe9dc; --gold-lo:#8a8071;
  --accent-fg:#1f1a0e;
  /* "dark" tokens now hold the champagne tones used for the tinted sections */
  --dark:#f1ece1; --dark-fg:#231e15; --dark-muted:#645c4f; --dark-line:#ddd5c4;
  --f-display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --gut:clamp(16px,4vw,56px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.75;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15;font-weight:500}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.wrap{padding-inline:var(--gut);max-width:1320px;margin-inline:auto}

/* scroll progress bar */
#bar{position:fixed;top:0;inset-inline:0;height:2px;z-index:60;background:linear-gradient(90deg,#231e15,#8a8071);transform-origin:0 50%;transform:scaleX(0);pointer-events:none}
[dir=rtl] #bar{transform-origin:100% 50%}

/* scroll reveal */
.rv{opacity:0;transform:translateY(32px);filter:blur(6px);transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none;filter:none}
.sp .w{display:inline-block;opacity:0;transform:translateY(.55em);filter:blur(8px);transition:opacity .8s var(--ease),transform .8s var(--ease),filter .8s var(--ease);transition-delay:calc(var(--i)*70ms)}
.sp.in .w{opacity:1;transform:none;filter:none}

/* nav */
.nav{position:fixed;inset-inline:0;top:env(safe-area-inset-top,0px);z-index:40;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px var(--gut);color:var(--fg);transition:background .3s,border-color .3s}
.nav.solid{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav ul{display:flex;gap:clamp(14px,2.4vw,32px);list-style:none;margin:0;padding:0;font-size:14px}
.nav a{text-decoration:none}
.nav ul a{opacity:.75}.nav ul a:hover{opacity:1}
.nav-r{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.pill{display:inline-flex;align-items:center;text-decoration:none;white-space:nowrap;border:1px solid currentColor;background:transparent;border-radius:99px;padding:5px 14px;font-family:var(--f-mono);font-size:12px;letter-spacing:.05em;transition:.25s}
.pill:hover{background:var(--fg)}.pill:hover>span{color:var(--bg)}
.pill.ink{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:500}
.pill.ink:hover{background:transparent}
.pill.ink>span{color:var(--bg)}.pill.ink:hover>span{color:var(--fg)}
@media(max-width:640px){.nav li.opt{display:none}.nav ul{gap:14px}}

/* hero (scrolls with the page, no pinning) */
.hero-wrap{position:relative;height:100svh;min-height:560px}
.hero{position:relative;height:100%;overflow:hidden;color:var(--dark-fg)}
.hero-bg{position:absolute;inset:0;overflow:hidden}
.hero-bg::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(250,247,241,0) 45%,rgba(250,247,241,.45) 100%),linear-gradient(to bottom,rgba(250,247,241,0) 92%,var(--bg))}
.blobs,.mist{position:absolute;inset:0;will-change:transform}
.blobs i{position:absolute;border-radius:50%;will-change:transform}
.blobs i:nth-child(1){width:64vmax;height:64vmax;left:-16vmax;top:-24vmax;background:radial-gradient(circle,#e8d9bd 0%,rgba(232,217,189,0) 65%);animation:drift1 22s ease-in-out infinite alternate}
.blobs i:nth-child(2){width:56vmax;height:56vmax;right:-18vmax;top:4vmax;background:radial-gradient(circle,#efe3cf 0%,rgba(239,227,207,0) 65%);animation:drift2 28s ease-in-out infinite alternate}
.blobs i:nth-child(3){width:50vmax;height:50vmax;left:18%;bottom:-28vmax;background:radial-gradient(circle,#e2d9c7 0%,rgba(226,217,199,0) 65%);animation:drift3 34s ease-in-out infinite alternate}
.blobs i:nth-child(4){width:40vmax;height:40vmax;left:34%;top:-8vmax;background:radial-gradient(circle,#ffffff 0%,rgba(255,255,255,0) 62%);animation:drift4 24s ease-in-out infinite alternate}
.blobs i:nth-child(5){width:36vmax;height:36vmax;right:8%;bottom:-10vmax;background:radial-gradient(circle,#ecdcc0 0%,rgba(236,220,192,0) 62%);animation:drift5 30s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(14vmax,10vmax,0) scale(1.18)}}
@keyframes drift2{to{transform:translate3d(-14vmax,8vmax,0) scale(.9)}}
@keyframes drift3{to{transform:translate3d(-9vmax,-12vmax,0) scale(1.2)}}
@keyframes drift4{to{transform:translate3d(-12vmax,9vmax,0) scale(1.25)}}
@keyframes drift5{to{transform:translate3d(10vmax,-9vmax,0) scale(.88)}}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.32;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .35 0 0 0 0 .3 0 0 0 0 .22 0 0 0 .5 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.hero-in{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:space-between;padding-block:clamp(72px,10vh,110px) clamp(20px,4vh,40px);pointer-events:none;max-width:none}
.hero-in a,.hero-in button{pointer-events:auto}
.hero-mid{margin-block:auto;padding-bottom:6vh;text-align:center;display:grid;justify-items:center;gap:16px;will-change:transform,opacity}
.hero h1{font-size:clamp(60px,15vw,230px);font-weight:500;letter-spacing:-.045em;line-height:.98;will-change:transform}
:lang(ar) .hero h1{letter-spacing:0}
.hero h1 .hw{display:inline-block;overflow:hidden;will-change:transform;vertical-align:top;padding:.16em .04em;margin:-.16em -.04em}
.hero h1 .hw>span{display:inline-block;transform:translateY(115%);animation:up 1.15s var(--ease) forwards;animation-delay:calc(.15s + var(--i)*.13s)}
.hair{display:block;width:min(220px,40vw);height:1px;background:linear-gradient(90deg,transparent,var(--fg),transparent);opacity:.35;transform:scaleX(0);animation:draw 1.4s .9s var(--ease) forwards}
@keyframes up{to{transform:none}}
@keyframes draw{to{transform:scaleX(1)}}
.hero .role{font-size:clamp(16px,2vw,22px);color:var(--dark-muted);max-width:44ch;margin:0;animation:fade 1.2s .6s both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hero-foot{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;animation:fade 1.2s .9s backwards}
.uni{display:flex;align-items:center;gap:12px;min-width:0}
.uni-logo{width:54px;height:54px;flex:none;border-radius:12px;border:1px solid var(--dark-line);display:grid;place-items:center;overflow:hidden;background:rgba(255,255,255,.7)}
.uni-logo.has{width:auto;height:auto;border:0;border-radius:0;background:none;overflow:visible;display:block}
.uni-logo img{width:100%;height:100%;object-fit:contain;display:block}
.uni-logo.has img{width:auto;height:56px;max-width:96px;object-fit:contain}
.uni-logo svg{width:26px;height:26px;color:var(--accent)}
.uni b{display:block;font-weight:500;font-size:15px;line-height:1.4}
.uni span{color:var(--dark-muted);font-size:13px}
.acts-hero{display:flex;gap:10px;flex-wrap:wrap}
.cue{position:absolute;left:50%;bottom:clamp(14px,3vh,26px);width:1px;height:46px;background:rgba(35,30,21,.16);overflow:hidden;z-index:2;display:none}
.cue::after{content:"";position:absolute;left:0;top:-40%;width:1px;height:40%;background:var(--fg);animation:cue 2.2s var(--ease) infinite}
@keyframes cue{to{top:100%}}
@media(min-width:1000px){.cue{display:block}}

/* brand-style action buttons */
.sb{display:inline-flex;align-items:center;gap:9px;text-decoration:none;border-radius:99px;padding:11px 20px;font-size:14px;font-weight:500;line-height:1;color:var(--fg);background:rgba(255,255,255,.62);border:1px solid rgba(35,30,21,.16);backdrop-filter:blur(8px);white-space:nowrap;transition:background .3s var(--ease),color .3s,border-color .3s,transform .3s var(--ease),box-shadow .3s}
.sb svg{width:18px;height:18px;flex:none;fill:currentColor}
.sb svg.st{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sb:hover{background:var(--fg);color:var(--bg);border-color:var(--fg);box-shadow:0 12px 24px -14px rgba(35,30,21,.6)}
.sb.cv{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sb.cv:hover{background:transparent;color:var(--fg)}

/* focus strip (replaces the moving text band) */
.focus{position:relative;background:var(--surface);border-block:1px solid var(--line)}
.focus-in{display:grid;grid-template-columns:repeat(4,1fr)}
.fc{position:relative;padding:clamp(22px,3vw,38px) clamp(16px,2vw,28px);border-inline-end:1px solid var(--line);display:grid;gap:8px;align-content:start;transition:background .5s var(--ease)}
.fc:last-child{border-inline-end:0}
.fc::before{content:"";position:absolute;inset-inline:0;top:-1px;height:2px;background:var(--fg);transform:scaleX(0);transform-origin:0 50%;transition:transform .7s var(--ease)}
[dir=rtl] .fc::before{transform-origin:100% 50%}
.fc:hover{background:var(--dark)}
.fc:hover::before{transform:scaleX(1)}
.fc i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.12em}
.fc b{font-family:var(--f-display);font-weight:400;font-size:clamp(18px,2vw,26px);line-height:1.2}
.fc p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
@media(max-width:860px){.focus-in{grid-template-columns:1fr 1fr}.fc:nth-child(2){border-inline-end:0}.fc:nth-child(-n+2){border-bottom:1px solid var(--line)}}

/* sections */
section{padding-block:clamp(64px,10vw,120px);position:relative}
/* every section has its own beige (slightly see-through so the floating dust still shows) */
#about{background:rgba(247,241,229,.9)}
#projects{background:rgba(252,250,245,.9)}
#skills{background:rgba(243,235,219,.9)}
#certs{background:rgba(249,244,234,.9)}
#lead{background:rgba(245,238,224,.9)}
.eyebrow{color:var(--accent);margin-bottom:18px;display:block}
.about{display:grid;grid-template-columns:1fr 1.5fr;gap:clamp(24px,6vw,96px)}
.about h2{font-size:clamp(26px,3.6vw,46px)}
.about p{margin:0 0 1em;font-size:clamp(16px,1.4vw,19px);max-width:60ch}
.langs{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.langs span{border:1px solid var(--line);border-radius:99px;padding:6px 16px;font-size:14px;background:var(--surface)}
.langs em{font-style:normal;color:var(--muted);font-family:var(--f-mono);font-size:12px;margin-inline-start:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;margin-top:clamp(40px,7vw,80px);border-top:1px solid var(--line)}
.stat{padding:24px 0;border-bottom:1px solid var(--line)}
.stat b{display:block;font-family:var(--f-display);font-weight:300;font-size:clamp(36px,5vw,64px);line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(120deg,#231e15,#6f665a);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--muted);font-size:14px}
@media(max-width:800px){.about{grid-template-columns:1fr}}

.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:clamp(28px,5vw,56px)}
.sec-head h2{font-size:clamp(30px,4.6vw,56px);font-weight:500;letter-spacing:-.02em}

/* projects: one layout for all */
.proj{display:grid;gap:clamp(56px,9vw,110px)}
.card{display:grid;gap:22px;cursor:pointer;text-align:start;padding:0;width:100%}
.frame{position:relative;aspect-ratio:16/8;overflow:hidden;margin-inline:var(--inset,9%);border-radius:var(--rad,28px);background:var(--dark);box-shadow:0 30px 60px -40px rgba(35,30,21,.4)}
.frame>.media{position:absolute;inset:0;transform:scale(var(--z,1.35));transform-origin:50% 50%;will-change:transform}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
@media(max-width:700px){.frame{aspect-ratio:4/3}}
.art{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;color:#3a342a;background:#f3eee4}
.art::before{content:"";position:absolute;inset:-30%;background:conic-gradient(from calc(var(--h)*1deg) at 50% 55%,#f3eee4,#e6dfcf 18%,#d6cdb9 30%,#faf7f1 45%,#e2dac8 65%,#efe9dc 78%,#f3eee4);filter:blur(50px);opacity:.9}
.art::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(35,30,21,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(35,30,21,.07) 1px,transparent 1px);background-size:40px 40px}
.art b{position:relative;z-index:1;font-family:var(--f-display);font-size:clamp(28px,6vw,80px);font-weight:600;letter-spacing:-.03em;text-align:center;padding-inline:16px;text-shadow:0 2px 30px rgba(255,255,255,.6)}
.card-meta{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding-inline:9%}
.card-meta h3{font-size:clamp(22px,3vw,36px);font-weight:500}
.card-meta p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.card-meta .go{flex:none;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:.3s var(--ease);background:var(--surface)}
.card:hover .go{background:var(--fg);color:var(--bg);border-color:var(--fg);transform:scale(1.08)}
.go svg{width:20px;height:20px}
[dir=rtl] .go svg{transform:scaleX(-1)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tags span{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted);background:var(--surface)}
.demo{display:inline-flex;align-items:center;gap:8px;margin-top:16px;text-decoration:none;border-radius:99px;padding:9px 20px;font-size:14px;font-weight:500;background:var(--fg);color:var(--bg);border:1px solid var(--fg);transition:background .3s var(--ease),color .3s,transform .25s var(--ease),box-shadow .25s}
.demo:hover{background:transparent;color:var(--fg)}
.demo svg{width:16px;height:16px;fill:currentColor;flex:none}

.dark{background:linear-gradient(180deg,#f5f0e6,#eee7da);color:var(--dark-fg)}
.dark .eyebrow{color:var(--accent)}
.skills-t{font-size:clamp(30px,4.6vw,56px);font-weight:500;letter-spacing:-.02em;margin-bottom:clamp(28px,5vw,56px)}

/* certs */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:clamp(20px,3vw,36px)}
.cert{display:grid;gap:14px;align-content:start;min-width:0}
.cert .cf{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--dark);border:1px solid var(--line);cursor:zoom-in}
.cert .cf img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s var(--ease)}
.cert .cf:hover img{transform:scale(1.06)}
.cert .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--accent);background:radial-gradient(circle at 50% 40%,#fdfbf6,#efe9dc 85%)}
.cert .ph::before{content:"";position:absolute;inset:12px;border:1px solid rgba(111,102,90,.35);border-radius:8px}
.cert .ph b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.3}
.cert .org{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.cert h3{font-size:19px;line-height:1.35}
.cert small{color:var(--muted);font-size:14px;line-height:1.6}
.up{position:absolute;inset-block-end:10px;inset-inline-end:10px;z-index:2;background:var(--fg);color:var(--bg);border-radius:99px;padding:3px 12px;font-family:var(--f-mono);font-size:11px;cursor:pointer}

/* leadership */
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{padding:26px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:8px 32px}
.list .org{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);grid-column:1/-1}
.list h3{font-size:clamp(20px,2.4vw,28px);font-weight:400}
.list small{color:var(--muted);font-size:15px;align-self:center}
@media(max-width:700px){.list li{grid-template-columns:1fr}}
h2.mid{font-size:clamp(28px,4vw,48px);margin-bottom:clamp(24px,4vw,44px);letter-spacing:-.02em}

/* contact (warm gold) */
.contact{background:linear-gradient(160deg,#f3eee3,#e9e1d0);--dark-line:rgba(35,30,21,.2);--dark-muted:#5a5245}
.contact h2{font-size:clamp(34px,6vw,76px);font-weight:600;letter-spacing:-.03em;margin-bottom:clamp(24px,5vw,48px)}
.contact h2 .w{background:linear-gradient(100deg,#231e15,#5a5245);-webkit-background-clip:text;background-clip:text;color:transparent;padding-inline:.05em}
.crow{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:center;padding-block:20px;border-top:1px solid var(--dark-line);text-decoration:none;min-width:0;transition:padding .4s var(--ease)}
.crow:last-of-type{border-bottom:1px solid var(--dark-line)}
.crow .mono{color:var(--dark-muted)}
.crow strong{font-family:var(--f-display);font-weight:300;font-size:clamp(16px,2vw,24px);overflow-wrap:anywhere;direction:ltr;text-align:start}
.crow button{background:transparent;border:1px solid var(--dark-line);color:var(--dark-fg);border-radius:99px;padding:5px 14px;font-family:var(--f-mono);font-size:12px}
.crow button:hover{border-color:var(--fg);background:rgba(255,255,255,.4)}
a.crow:hover{padding-inline-start:16px}.contact a.crow:hover strong{color:var(--fg)}
@media(max-width:560px){.crow{grid-template-columns:1fr auto}.crow .mono{grid-column:1/-1}}
footer{padding-block:28px 0;color:var(--dark-muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:32px}

/* sheet + lightbox */
.sheet{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;transform:translateY(100%);visibility:hidden;transition:transform .55s var(--ease),visibility 0s .55s;padding-top:env(safe-area-inset-top,0px)}
.sheet.open{transform:none;visibility:visible;transition:transform .55s var(--ease)}
.sheet-bar{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:14px var(--gut);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.sheet-bar .pill{color:var(--fg)}
.sheet h2{font-size:clamp(32px,5.5vw,64px);letter-spacing:-.03em;margin-block:clamp(28px,6vw,64px) 12px}
.sheet .sum{font-size:clamp(17px,1.8vw,21px);max-width:60ch;color:var(--muted);margin:0 0 28px}
.gal{display:grid;gap:clamp(24px,4vw,48px);margin-block:32px 48px}
.gal .frame{aspect-ratio:16/10}
.add{aspect-ratio:16/6;border:1px dashed var(--line);border-radius:20px;display:grid;place-items:center;color:var(--muted);width:100%;cursor:pointer}
.sheet-cols{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,6vw,80px);padding-bottom:64px}
@media(max-width:800px){.sheet-cols{grid-template-columns:1fr}}
.sheet h3{font-size:13px;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:12px}

/* ---------- detail sheet ---------- */
let currentId = null, lastFocus = null, zoomEls = [];
function openSheet(id, keep){
  const p = P.find(x=>x.id===id); if(!p) return;
  currentId = id;
  const imgs = getImgs(p);
  const gal = imgs.length ? imgs.map((s,i)=>frame(p,i)).join("") : frame(p);
  const add = EDIT ? `<label class="add">${T("addimg")}<input type="file" accept="image/*" multiple hidden data-add="${p.id}"></label>` : "";
  const b = arr => `<ul class="b">${arr.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  $("#sheetKick").textContent = p.type;
  $("#sheetBody").innerHTML = `<h2>${esc(L(p.name))}</h2><p class="sum">${esc(L(p.sum))}</p>
    ${p.link?`<div class="links"><a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener">${projLabel(p,false)} ↗</a></div>`:""}
    <div class="gal">${gal}${add}</div>
    <div class="sheet-cols">
      <div><h3>${T("type_built")}</h3>${b(L(p.built))}</div>
      <div><h3>${T("type_tech")}</h3><div class="tags" style="margin-bottom:28px">${p.tech.map(t=>`<span>${esc(t)}</span>`).join("")}</div>
      ${p.learned?`<h3>${T("learned")}</h3>${b(L(p.learned))}`:""}</div></div>`;
  const s = $("#sheet"); s.classList.add("open"); s.setAttribute("aria-hidden","false");
  if(!keep){ s.scrollTop = 0; lastFocus = document.activeElement; document.body.style.overflow="hidden"; $("#closeBtn").focus(); }
  zoomEls = $$(".zoomfx"); update();
}
function closeSheet(){
  $("#sheet").classList.remove("open"); $("#sheet").setAttribute("aria-hidden","true");
  document.body.style.overflow=""; currentId=null;
  if(lastFocus) try{lastFocus.focus()}catch(e){}
}

/* ---------- scroll engine ---------- */
const clamp = (v,a=0,b=1)=>Math.min(b,Math.max(a,v));
function countUp(el){
  const n = +el.dataset.n; if(reduce||!n) return;
  const t0 = performance.now();
  (function step(t){ const k = clamp((t-t0)/1400); el.textContent = Math.round(n*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step); })(t0);
}

/* hero: the page scrolls normally; only the name/panel ease with a smoothed value */
let tp = 0, hp = 0, hRun = false;
function heroApply(){
  const e = 1-Math.pow(1-hp,2), ws = $$("#heroName .hw");
  $("#blobs").style.transform = `translate3d(0,${e*12}vh,0)`;
  ws.forEach((w,i)=>{ const dir = ws.length>1 ? (i%2 ? 1 : -1) : 0; w.style.transform = `translate3d(${dir*e*28}vw,0,0)`; });
  $("#heroMid").style.transform = `translate3d(0,${hp*6}vh,0) scale(${1+hp*0.35})`;
  $("#heroMid").style.opacity = 1-clamp(hp*1.25);
  $("#heroFoot").style.opacity = 1-clamp(hp*1.8);
  $("#cue").style.opacity = 1-clamp(hp*3);
  $("#heroFoot").style.pointerEvents = hp>.5 ? "none" : "";
}
function heroTick(){
  hp += (tp-hp)*.16;
  if(Math.abs(tp-hp)<.0008) hp = tp;
  heroApply();
  if(hp!==tp) requestAnimationFrame(heroTick); else hRun = false;
}
let hsDist = 0;
function hsMeasure(){
  const hs = $("#hs"); if(!hs) return;
  if(reduce){ hs.style.height = "auto"; return; }
  hsDist = Math.max(0, $("#hsTrack").scrollWidth - innerWidth);
  hs.style.height = ($("#hsIn").offsetHeight + hsDist) + "px";
}
function hsApply(){
  const hs = $("#hs"); if(!hs || reduce) return;
  const r = hs.getBoundingClientRect(), total = hs.offsetHeight - innerHeight;
  const p = total>0 ? clamp(-r.top/total) : 0;
  $("#hsTrack").style.transform = `translate3d(${-p*hsDist}px,0,0)`;
  $("#hsDot").style.left = (p*100)+"%";
}
function update(){
  const vh = innerHeight, y = scrollY;
  $("#nav").classList.toggle("solid", y > vh*0.75);
  const max = document.documentElement.scrollHeight - vh;
  $("#bar").style.transform = `scaleX(${max>0?clamp(y/max):0})`;

  hsApply();
  tp = reduce ? 0 : clamp(y/vh);
  if(!hRun){ hRun = true; requestAnimationFrame(heroTick); }

  zoomEls.forEach(el=>{
    const r = el.getBoundingClientRect();
    if(r.bottom < -60 || r.top > vh+60) return;
    let k = reduce ? 1 : clamp((vh - r.top)/(vh*0.75));
    k = 1-Math.pow(1-k,2);
    el.style.setProperty("--inset", ((1-k)*9)+"%");
    el.style.setProperty("--rad", (30*(1-k)+10*k)+"px");
    el.style.setProperty("--z", (1.35-.35*k).toFixed(3));
  });
  $$(".rv:not(.in),.sp:not(.in)").forEach(el=>{
    const r = el.getBoundingClientRect();
    if(r.top < vh*0.92 && r.bottom > 0){
      el.classList.add("in");
      const c = el.querySelector("[data-n]") || (el.dataset.n ? el : null); if(c) countUp(c);
    }
  });
}
let tick=false;
function onScroll(){ if(tick) return; tick=true; requestAnimationFrame(()=>{tick=false;update()}); }
addEventListener("scroll", onScroll, {passive:true, capture:true});
addEventListener("resize", ()=>{ hsMeasure(); onScroll(); });
addEventListener("load", ()=>{ hsMeasure(); onScroll(); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ hsMeasure(); onScroll(); });

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const t = e.target;
  if(t.closest(".card a")) return;              /* live demo / prototype / GitHub link: just follow it */
  const card = t.closest("[data-id]"); if(card){ openSheet(card.dataset.id); return; }
  if(t.closest("#closeBtn")){ closeSheet(); return; }
  const lb = t.closest("[data-lb]"); if(lb && !t.closest(".up")){ $("#lb img").src = lb.dataset.lb; $("#lb").classList.add("open"); return; }
  if(t.closest("#lb")){ $("#lb").classList.remove("open"); return; }
  const cp = t.closest("[data-copy]");
  if(cp){
    const done = ()=>{ cp.textContent=T("copied"); setTimeout(()=>cp.textContent=T("copy"),1400); };
    (navigator.clipboard ? navigator.clipboard.writeText(cp.dataset.copy) : Promise.reject()).then(done).catch(()=>{
      const r=document.createRange(); r.selectNodeContents(cp.closest(".crow").querySelector("strong")); const s=getSelection(); s.removeAllRanges(); s.addRange(r);
    });
  }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if($("#lb").classList.contains("open")) $("#lb").classList.remove("open"); else if(currentId) closeSheet(); }
  if((e.key==="Enter"||e.key===" ") && e.target.classList && e.target.classList.contains("card")){ e.preventDefault(); openSheet(e.target.dataset.id); }
});
$("#langBtn").addEventListener("click", ()=>{ lang = lang==="ar"?"en":"ar"; try{localStorage.setItem("pf-lang",lang)}catch(e){} render(); });

function shrink(file, max=1600){
  return new Promise(res=>{
    const fr = new FileReader();
    fr.onload = ()=>{ const im = new Image(); im.onload = ()=>{
      const k = Math.min(1, max/Math.max(im.width, im.height));
      const cv = document.createElement("canvas"); cv.width = im.width*k; cv.height = im.height*k;
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height); res(cv.toDataURL("image/jpeg",.82)); };
      im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}
document.addEventListener("change", async e=>{
  const t = e.target;
  if(t.dataset.add){
    const list = t.dataset.single ? [] : (store.get("pf-img-"+t.dataset.add) || []);
    for(const f of t.files) list.push(await shrink(f));
    store.set("pf-img-"+t.dataset.add, list); render();
  }
  if(t.dataset.logo){ store.set("pf-logo", await shrink(t.files[0], 300)); render(); }
});

/* ---------- hero: mist follows the pointer very slightly ---------- */
(function(){
  const mist = $("#mist"); if(!mist || reduce) return;
  let tx=0, ty=0, x=0, y=0, run=false;
  function tick(){
    x += (tx-x)*.05; y += (ty-y)*.05;
    mist.style.transform = `translate3d(${(-x*5).toFixed(2)}vmax,${(-y*4).toFixed(2)}vmax,0)`;
    if(Math.abs(tx-x)+Math.abs(ty-y) > .0005) requestAnimationFrame(tick); else run = false;
  }
  addEventListener("pointermove", ev=>{ tx = ev.clientX/innerWidth-.5; ty = ev.clientY/innerHeight-.5; if(!run){ run = true; requestAnimationFrame(tick); } }, {passive:true});
})();

/* ---------- pointer touches (desktop only): buttons lean toward the pointer, the big name leans away ---------- */
(function(){
  if(reduce || !matchMedia("(hover:hover) and (pointer:fine)").matches) return;
  let nx=0, ny=0, px=0, py=0, run=false, mag=null;
  function loop(){
    px += (nx-px)*.06; py += (ny-py)*.06;
    const h = $("#heroName"); if(h && scrollY < innerHeight) h.style.transform = `translate3d(${(px*-18).toFixed(2)}px,${(py*-12).toFixed(2)}px,0)`;
    if(Math.abs(nx-px)+Math.abs(ny-py) > .002) requestAnimationFrame(loop); else run = false;
  }
  addEventListener("pointermove", e=>{
    nx = e.clientX/innerWidth-.5; ny = e.clientY/innerHeight-.5;
    const m = e.target.closest(".sb,.pill.ink,.demo,.btn");
    if(m !== mag){ if(mag) mag.style.transform = ""; mag = m; }
    if(mag){ const r = mag.getBoundingClientRect(); mag.style.transform = `translate3d(${((e.clientX-(r.left+r.width/2))*.25).toFixed(1)}px,${((e.clientY-(r.top+r.height/2))*.35).toFixed(1)}px,0)`; }
    if(!run){ run = true; requestAnimationFrame(loop); }
  }, {passive:true});
  document.addEventListener("pointerleave", ()=>{ if(mag){ mag.style.transform = ""; mag = null; } });
})();

/* ---------- background: tiny floating dust that drifts with scroll and shies away from the pointer ---------- */
(function(){
  const cv = $("#dust"); if(!cv) return; const ctx = cv.getContext("2d");
  let W=0, H=0, ds=[], run=false, mx=-999, my=-999, lastY=scrollY;
  function size(){
    const dpr = Math.min(2, devicePixelRatio||1); W = innerWidth; H = innerHeight;
    cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(Math.min(70, Math.max(26, W*H/22000)));
    ds = Array.from({length:n}, ()=>{ const z = Math.random();
      return {x:Math.random()*W, y:Math.random()*H, z, r:.8+z*1.9, vx:(Math.random()-.5)*.18, vy:(Math.random()-.5)*.18, a:.18+z*.32, ph:Math.random()*6.3}; });
  }
  function draw(t){
    ctx.clearRect(0,0,W,H);
    const dy = scrollY-lastY; lastY = scrollY;
    for(const d of ds){
      d.x += d.vx; d.y += d.vy - dy*d.z*.35;
      if(d.x<-10) d.x=W+10; else if(d.x>W+10) d.x=-10;
      if(d.y<-10) d.y=H+10; else if(d.y>H+10) d.y=-10;
      const ex = d.x-mx, ey = d.y-my, e2 = ex*ex+ey*ey;
      if(e2 < 14000){ const k = 1-e2/14000, m = Math.sqrt(e2)||1; d.x += ex/m*k*1.4; d.y += ey/m*k*1.4; }
      const tw = .75+.25*Math.sin(t*.0015+d.ph);
      ctx.fillStyle = `rgba(35,30,21,${(d.a*tw).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,6.283); ctx.fill();
    }
  }
  function loop(t){ if(!run) return; draw(t); requestAnimationFrame(loop); }
  function start(){ if(run || reduce || document.hidden) return; run = true; requestAnimationFrame(loop); }
  addEventListener("pointermove", ev=>{ mx = ev.clientX; my = ev.clientY; }, {passive:true});
  document.addEventListener("pointerleave", ()=>{ mx = my = -999; });
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden) run = false; else start(); });
  let rt; addEventListener("resize", ()=>{ clearTimeout(rt); rt = setTimeout(()=>{ size(); if(reduce) draw(0); }, 150); });
  size();
  if(reduce) draw(0); else start();
})();

/* ---------- contact form ---------- */
function toast(msg){ const t = $("#toast"); $("#toastMsg").textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(()=>t.classList.remove("show"), 4200); }
$("#cform").addEventListener("submit", async e=>{
  e.preventDefault();
  const f = e.target, note = $("#fnote"), btn = f.querySelector("button"), d = Object.fromEntries(new FormData(f));
  note.className = "fnote";
  if(d._gotcha) return;                                   /* spam trap */
  if(!d.name.trim() || !/^\S+@\S+\.\S+$/.test(d.email.trim()) || !d.message.trim()){ note.textContent = T("f_err_v"); note.classList.add("err"); return; }
  if(PROFILE.formEndpoint){
    btn.disabled = true; note.textContent = T("f_sending");
    try{
      const r = await fetch(PROFILE.formEndpoint, {method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"}, body:JSON.stringify({name:d.name, email:d.email, message:d.message})});
      if(!r.ok) throw new Error("bad status");
      f.reset(); note.textContent = ""; toast(T("f_ok"));
    }catch(_){ note.textContent = T("f_err"); note.classList.add("err"); }
    btn.disabled = false;
  } else if(PROFILE.email){
    const body = d.message + "\n\n— " + d.name + " (" + d.email + ")";
    note.textContent = T("f_mailto"); note.classList.add("ok");
    location.href = "mailto:" + PROFILE.email + "?subject=" + encodeURIComponent("Portfolio message from " + d.name) + "&body=" + encodeURIComponent(body);
  } else { note.textContent = T("f_err"); note.classList.add("err"); }
});

render();
</script>
